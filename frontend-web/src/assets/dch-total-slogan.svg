  <!-- Texto Total -->
  <text x="120" y="152" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="6">TOTAL</text>
  <!-- Tagline -->
  <text x="120" y="172" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#F18A21" text-anchor="middle" letter-spacing="1">Plataforma de Recursos Humanos</text>
