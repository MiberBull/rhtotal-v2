<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <!-- Símbolo ∞ bicolor grande: izquierda azul, derecha naranja -->
  <defs>
    <clipPath id="inf-left">
      <rect x="80" y="0" width="60" height="200"/>
    </clipPath>
    <clipPath id="inf-right">
      <rect x="140" y="0" width="60" height="200"/>
    </clipPath>
  </defs>

  <!-- ∞ lado azul -->
  <text x="78" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="#005696" clip-path="url(#inf-left)">∞</text>
  <!-- ∞ lado naranja -->
  <text x="78" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="#F18A21" clip-path="url(#inf-right)">∞</text>

  <!-- Wordmark: D naranja -->
  <text x="70" y="118" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#F18A21">D</text>
  <!-- CH azul -->
  <text x="92" y="118" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#005696">CH</text>
  <!-- Total azul -->
  <text x="130" y="118" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#005696"> Total</text>

  <!-- Tagline -->
  <text x="140" y="144" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#ffffff" text-anchor="middle" opacity="0.85">Gestión integral de talento</text>

  <!-- Separador -->
  <line x1="80" y1="155" x2="200" y2="155" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>

  <!-- Footer: Un servicio de DCH -->
  <text x="140" y="170" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.6">Un servicio de DCH Servicios Especializados</text>
  <!-- Footer: board-ai.mx -->
  <text x="140" y="183" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.4">Desarrollado por board-ai.mx</text>
</svg>
