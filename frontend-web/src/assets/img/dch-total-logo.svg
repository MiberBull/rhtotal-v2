<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40">
  <!-- Símbolo ∞ bicolor: izquierda azul, derecha naranja -->
  <defs>
    <clipPath id="inf-left-h">
      <rect x="0" y="0" width="18" height="40"/>
    </clipPath>
    <clipPath id="inf-right-h">
      <rect x="18" y="0" width="18" height="40"/>
    </clipPath>
  </defs>
  <!-- ∞ lado azul (izquierda) -->
  <text x="2" y="30" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#005696" clip-path="url(#inf-left-h)">∞</text>
  <!-- ∞ lado naranja (derecha) -->
  <text x="2" y="30" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#F18A21" clip-path="url(#inf-right-h)">∞</text>

  <!-- Wordmark: D naranja -->
  <text x="42" y="28" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#F18A21">D</text>
  <!-- CH azul -->
  <text x="55" y="28" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#005696">CH</text>
  <!-- Total azul, peso normal -->
  <text x="80" y="28" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#005696"> Total</text>
</svg>
