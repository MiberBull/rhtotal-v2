<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 40" width="190" height="40">
  <!--
    ∞ bicolor: two open bezier arcs sharing the crossing points.
    Orange (right lobe) drawn first (behind), blue (left lobe) on top.
    No font rendering dependency.
  -->

  <!-- Right lobe — DCH Orange -->
  <path d="M 22,18 C 24,12 29,8 34,8 C 39,8 43,14 43,20 C 43,26 39,32 34,32 C 29,32 24,28 22,22"
        fill="none" stroke="#F18A21" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left lobe — DCH Blue (drawn on top for crossing effect) -->
  <path d="M 22,18 C 20,12 15,8 10,8 C 5,8 1,14 1,20 C 1,26 5,32 10,32 C 15,32 20,28 22,22"
        fill="none" stroke="#005696" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Wordmark — using tspan for reliable auto-positioning -->
  <text x="52" y="27" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
    <tspan font-size="19" font-weight="800" fill="#F18A21">D</tspan><tspan font-size="19" font-weight="800" fill="#005696">CH</tspan><tspan dx="3" font-size="17" font-weight="400" fill="#005696">Total</tspan>
  </text>
</svg>
