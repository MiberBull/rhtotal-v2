<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 94">
  <style>
    @keyframes pulseLeft {
      0%, 100% { stroke-opacity: 1; }
      50%       { stroke-opacity: 0.15; }
    }
    @keyframes pulseRight {
      0%, 100% { stroke-opacity: 0.15; }
      50%       { stroke-opacity: 1; }
    }
    .lobe-left  { animation: pulseLeft  1.4s ease-in-out infinite; }
    .lobe-right { animation: pulseRight 1.4s ease-in-out infinite; }
  </style>

  <!-- Right lobe — DCH Orange (behind) -->
  <path class="lobe-right"
        d="M 48,40 C 51,29 61,21 70,21 C 79,21 87,29 87,47 C 87,65 79,73 70,73 C 61,73 51,65 48,54"
        fill="none" stroke="#F18A21" stroke-width="6" stroke-linecap="round"/>

  <!-- Left lobe — DCH Blue (on top) -->
  <path class="lobe-left"
        d="M 48,40 C 45,29 35,21 26,21 C 17,21 9,29 9,47 C 9,65 17,73 26,73 C 35,73 45,65 48,54"
        fill="none" stroke="#005696" stroke-width="6" stroke-linecap="round"/>
</svg>
