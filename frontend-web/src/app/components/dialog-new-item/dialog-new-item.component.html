<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content> 
  <mat-form-field>
    <textarea matInput [placeholder]="placeholder" [(ngModel)]="item" minlength="1" maxlength="50"></textarea>
  </mat-form-field>
</mat-dialog-content>
<div class="container-row-buttons">
  <mat-dialog-actions>
    <button mat-raised-button mat-dialog-close color="primary">Cancelar</button>
  </mat-dialog-actions>
  <mat-dialog-actions>
    <button mat-raised-button mat-dialog-close color="primary"(click)="saveItem()" >Guardar</button>
  </mat-dialog-actions>
</div>
