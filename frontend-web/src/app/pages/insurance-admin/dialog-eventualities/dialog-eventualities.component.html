<div class="containerForm">
  <h2>{{title}}</h2>
  <form [formGroup]="eventualyFrom" class="form-notification container">
      <mat-form-field class="example-full-width">
            <textarea matInput maxlength="250" placeholder="Nombre / Titulo" formControlName="titleEventualy" required></textarea>
            <mat-error *ngIf="eventualyFrom.get('titleEventualy').value === ''">El campo es requerido</mat-error>
      </mat-form-field>
      <mat-form-field class="example-full-width">
          <textarea matInput placeholder="Descripción" formControlName="description" maxlength="500" required></textarea>
         <mat-error *ngIf="eventualyFrom.get('description').value === ''">El campo es requerido</mat-error>
      </mat-form-field>

      <mat-form-field class="example-full-width">
        <input matInput maxlength="12" placeholder="Suma asegurada" formControlName="sumAssured" required>
        <mat-error *ngIf="eventualyFrom.get('sumAssured').value === ''">El campo es requerido</mat-error>
        <mat-error *ngIf="eventualyFrom.get('sumAssured').value != '' && !eventualyFrom.get('sumAssured').valid">Datos incorrectos</mat-error>
      </mat-form-field>

      <mat-form-field class="example-full-width">
         <input matInput maxlength="12" placeholder="Prima" formControlName="securedPremium" required>
         <mat-error *ngIf="eventualyFrom.get('securedPremium').value === ''">El campo es requerido</mat-error>
         <mat-error *ngIf="eventualyFrom.get('securedPremium').value != '' && !eventualyFrom.get('securedPremium').valid">Datos incorrectos</mat-error>
      </mat-form-field>
      <mat-form-field class="example-full-width">
        <input matInput maxlength="5" placeholder="Deducibles" formControlName="deductibles" required>
        <mat-error *ngIf="eventualyFrom.get('deductibles').value === ''">El campo es requerido</mat-error>
        <mat-error *ngIf="eventualyFrom.get('deductibles').value != '' && !eventualyFrom.get('deductibles').valid">Datos incorrectos</mat-error>
      </mat-form-field>
      <mat-form-field class="example-full-width" *ngIf="showEstado">
        <mat-select placeholder="Estatus" formControlName="status">
          <mat-option *ngFor="let s of status" [value]="s.value" >
            {{s.title}}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <div class="containerButton">
          <button mat-flat-button (click)="closeDialog()">Cancelar</button>
          <button mat-flat-button (click)="saveUpdateEventualy()" [disabled]="!eventualyFrom.valid">Guardar</button>
      </div>
  </form>
</div>
