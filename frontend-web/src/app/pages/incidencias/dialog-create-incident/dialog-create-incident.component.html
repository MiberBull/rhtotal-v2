<h2 mat-dialog-title>Nueva Incidencia</h2>

<mat-dialog-content>
  <div class="form-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>ID Empleado *</mat-label>
      <input matInput type="number" [(ngModel)]="incident.idEmployee" placeholder="Ej. 1234" />
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo de incidencia *</mat-label>
      <mat-select [(ngModel)]="incident.dsType">
        <mat-option *ngFor="let t of INCIDENT_TYPES" [value]="t.value">{{ t.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha de incidencia *</mat-label>
      <input matInput type="date" [(ngModel)]="incident.dtIncidentDate" />
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha fin (opcional)</mat-label>
      <input matInput type="date" [(ngModel)]="incident.dtEndDate" />
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas</mat-label>
      <textarea
        matInput
        rows="3"
        [(ngModel)]="incident.dsNotes"
        placeholder="Observaciones..."
      ></textarea>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()">
    <mat-icon>save</mat-icon> Guardar
  </button>
</mat-dialog-actions>
