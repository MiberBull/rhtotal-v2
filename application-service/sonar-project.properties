# Equivalente al groupId de Maven
sonar.projectKey=18_WorkPoint_RHTotal_Application

# Equivalente al artifactId de Maven
sonar.projectName=18_WorkPoint_RHTotal_Application

# Equivalente a la versión de Maven
sonar.projectVersion=1.0

# Directorio donde resida el código fuente a analizar
sonar.sources=application-service/application-commons/src/main/java,application-service/application-model/src/main/java,application-service/application-persistence/src/main/java,application-service/application-services/src/main/java,application-service/application-web/src/main/java

# Lenguaje que a analizar (Java por defecto)
sonar.language=java

# Comma-separated paths to directories with tests
sonar.tests=application-service/application-commons/src/test/java,application-service/application-model/src/test/java,application-service/application-persistence/src/test/java,application-service/application-services/src/test/java

# Comma-separated paths to directories containing the compiled bytecode files corresponding to your source files
sonar.java.binaries=application-service/application-commons/target/classes,application-service/application-model/target/classes,application-service/application-persistence/target/classes,application-service/application-services/target/classes,application-service/application-web/target/classes

# Encoding de código fuente
sonar.sourceEncoding=UTF-8

