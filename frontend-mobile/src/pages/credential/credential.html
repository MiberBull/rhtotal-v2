<ion-content padding >

    <div class="background-credential" *ngIf="viewCredential">
        <div style="display: flex; margin-top: -20px; flex-direction: column; color: white; max-width: 15.75rem; min-width: 15.75rem;">
            <div style="display: flex; flex-direction: column; margin-bottom: 15px;">
                <label style="color: #149AD5; font-size: 12px;">NOMBRE</label>
                <label>{{ name }}</label>
                <div style="background-color: #066996; height: 2px;"></div>
            </div>
            <div style="display: flex; flex-direction: column; margin-bottom: 15px;">
                <label style="color: #149AD5; font-size: 12px;">NÚMERO USUARIO</label>
                <label>{{ numberEmployee }}</label>
                <div style="background-color: #066996; height: 2px;"></div>
            </div>
            <div style="display: flex; flex-direction: column;">
                <label style="color: #149AD5; font-size: 12px;">USUARIO RHTOTAL DESDE</label>
                <label>{{ since }}</label>
                <div style="background-color: #066996; height: 2px; max-width: 15rem;"></div>
            </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; height: 60%; margin-top: -30px; justify-content: center;">
            <img [src]=" image | defaultImage:'assets/imgs/icon.svg'" style="height: 7.5rem; width: 8.5rem; border-radius: 50%; margin-bottom: 10px;">
            <img src="assets/imgs/rh_total.svg" style="height: 3rem;">
        </div>
    </div>
  

</ion-content>
