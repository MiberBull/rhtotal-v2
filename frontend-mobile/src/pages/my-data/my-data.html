<ion-header>
    <ion-toolbar no-padding>
        <ion-grid>
          <ion-row col-12 (click)="returnPageMyData()" >
            <ion-icon ios="ios-arrow-back" md="md-arrow-back" style="color:#1099D6; font-size:30px;" ></ion-icon>
            <div class="title">Mis datos</div>
          </ion-row>
          <ion-row >
              <ion-col col-12>
                  <p class="encabezado">Llena tus datos y accede <br> a más beneficios</p>   
              </ion-col>
          </ion-row>
        </ion-grid>
    </ion-toolbar>
</ion-header>

<ion-content no-padding>
        <ion-tabs #myTabs tabsPlacement="top">
            <ion-tab [root]="tab1Root"  tabTitle="Datos personales" ></ion-tab>
            <ion-tab [root]="tab2Root" [enabled]="tab1" tabTitle="Domicilio"></ion-tab>
            <!--ion-tab [root]="tab3Root" [enabled]="tab2" tabTitle="Redes sociales"></ion-tab-->
          </ion-tabs>          

</ion-content>
