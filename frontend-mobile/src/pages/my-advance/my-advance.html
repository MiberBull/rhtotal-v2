<ion-content>

  <div class="content-header" style="background-image: url('assets/imgs/headers/advance.png');">
    <div class="content-sub-header" (click)="backDiscount()" >
        <ion-icon ios="ios-arrow-back" md="md-arrow-back" class="image-header" ></ion-icon>
        <div class="text-title" >Mi adelanto</div>
    </div>  
    <div class="encabezado"> Adelanta tu pago <br> el día que quieras </div>
  </div>
  <div style="height:65%; overflow-y: auto; padding-bottom: 15%; padding: 0px 20px;">
    <br>
    <p class="information-paragraph"> Pide por adelantado el pago de un porcentaje de tu nómina. Necesitas una antigüedad mínima de 3 meses en la empresa.</p>

    <ion-item-divider>
      <div style="display: flex; flex-direction: column;">
        <label class="title-info">Monto correspondiente</label>
        <label class="wrapper-concept">${{correspondingAmount}}</label>
      </div>
    </ion-item-divider>
    <ion-item-divider>
        <div style="display: flex; flex-direction: column;">
          <label class="title-info">Selecciona el porcentaje que deseas</label>
          <div style="display: flex; justify-content: space-around;">

            <button [ngClass]="{'wrapper-porcentage-selected': porcentage === 0,
                                'wrapper-porcentage-default': porcentage != 0}" (click)="selectPorcentage(0)">20%</button>

            <button [ngClass]="{'wrapper-porcentage-selected': porcentage === 1,
                                'wrapper-porcentage-default': porcentage != 1}" (click)="selectPorcentage(1)">40%</button>

            <button [ngClass]="{'wrapper-porcentage-selected': porcentage === 2,
                                'wrapper-porcentage-default': porcentage != 2}" (click)="selectPorcentage(2)">60%</button>

            <button [ngClass]="{'wrapper-porcentage-selected': porcentage === 3,
                                'wrapper-porcentage-default': porcentage != 3}" (click)="selectPorcentage(3)">80%</button>
          </div>
        </div>
    </ion-item-divider>
    <ion-item-divider>
      <div style="display: flex; flex-direction: column;">
        <label class="title-info">Monto a recibír</label>
        <label class="wrapper-concept">${{ acomulatedAmount }}</label>
      </div>
    </ion-item-divider>
    <ion-item-divider>
      <div style="display: flex; flex-direction: column;">
        <label class="second-info">Forma de pago</label>
        <label>{{ wayToPay }}</label>
      </div>
    </ion-item-divider>
    <ion-item-divider>
        <div style="display: flex; flex-direction: column;">
          <label class="second-info">Monto restante</label>
          <label>${{ nextPaymentAmount }}</label>
        </div>
      </ion-item-divider>
    <ion-item-divider>
      <div style="display: flex; flex-direction: column;">
        <label class="second-info">Siguiente pago</label>
        <label>{{ nextPayment }}</label>
      </div>
    </ion-item-divider>
    <p>*Comisión de {{ commission }}% IVA incluido sobre el monto solicitado</p>
  </div>
  <div style="display: flex; justify-content: center;">
    <button ion-button style="background-color: #1469AF" (click)="showConfirmAlert()" >Solicitar</button>
  </div>
</ion-content>
