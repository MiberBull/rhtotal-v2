  Ionic pages and navigation.

<ion-content>
  <div  class="content-header"  style="background-image: url('assets/imgs/micv.png');">
    <div class="content-sub-header">
      <div class="text-title">CV</div>
    </div>
    <div class="encabezado">
      Manten tu información <br />
      actualizada
    </div>
  </div>
  <div style="height: 5%; width: 100%; display: flex;  justify-content: flex-end;">
      <button ion-button clear item-right  [disabled]="okConfirmCode"> 
          <ion-icon ios="ios-create"  md="md-create" style="margin-right: 16px; margin-top: 10px; margin-bottom: 10px;" color="primary" (click)="openFilePdf()"></ion-icon>
      </button>
  </div>
  <div style="height: 75%; overflow-y: auto; padding-left: 16px; padding-right: 16px;">
    <pdf-viewer  [src]="pdfSrc"  [original-size]="false" 
    (after-load-complete)="callBackFn($event)"
    [render-text]="true"  
    style="display: block;" ></pdf-viewer>
  </div>
</ion-content>
