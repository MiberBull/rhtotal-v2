<!--

  Ionic pages and navigation.
-->
<ion-content>
  <form [formGroup]="todo" (ngSubmit)="saveSalary()" padding-right padding-bottom>

    <ion-item>
      <ion-label stacked>Sueldo bruto mensual</ion-label>
      <ion-input type="tel"  [max-limit]="12"  formControlName="Sueldo_bruto_mensual"
      [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
    </ion-item>
    
    <samp class="error-spam " *ngIf="!this.todo.get('Sueldo_bruto_mensual').valid && this.todo.get('Sueldo_bruto_mensual').value != ''">Formato incorrecto</samp>
    
    <ion-item>
      <ion-label stacked>Ingreso mensual bruto integrado</ion-label>
      <ion-input type="tel" [max-limit]="12" formControlName="Ingreso_mensual_bruto_integrado"
      [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
    </ion-item>
    <samp class="error-spam " *ngIf="!this.todo.get('Ingreso_mensual_bruto_integrado').valid">Formato incorrecto</samp>
    <ion-item>
      <ion-label stacked>Ingreso anual bruto estimado</ion-label>
      <ion-input type="tel" [max-limit]="12" formControlName="Ingreso_anual_bruto_estimado"
      [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
    </ion-item>
    <samp class="error-spam " *ngIf="!this.todo.get('Ingreso_anual_bruto_estimado').valid">Formato incorrecto</samp>

    <div style="display: flex; flex-direction: row; justify-content: center; padding-bottom: 25px;">
      <button ion-button type="submit" [disabled]="!todo.valid" >guardar</button>
    </div>
  </form>

</ion-content>
