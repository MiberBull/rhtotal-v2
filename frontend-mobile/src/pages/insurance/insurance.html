<!--
  Generated template for the InsurancePage page.

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->

<ion-content>

  <form [formGroup]="todo"  (ngSubmit)="saveInsurance()" padding-right padding-bottom>
    <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 15px; ">
      <div style="display: flex; justify-content: initial; width: 50%;;">
        Seguro GM mayores
      </div>
      <div style="width: 50%;">
        <div style="width: 100px;">
          <tm-three-steps-selector formControlName="Seguro_GM_Mayores" [disabled]="selectEnabled" (onchange)="changeState($event)">
          </tm-three-steps-selector>
        </div>
      </div>
    </div>


    <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 15px; ">
      <div style="display: flex; justify-content: initial; width: 50%;;">
        Seguro GM menores
      </div>
      <div style="width: 50%;">
        <div style="width: 100px;">
          <tm-three-steps-selector formControlName="Seguro_GM_Menores" [disabled]="selectEnabled" (onchange)="changeState($event)">
          </tm-three-steps-selector>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 15px; ">
      <div style="display: flex; justify-content: initial; width: 50%;;">
        Seguro de vida
      </div>
      <div style="width: 50%;">
        <div style="width: 100px;">
          <tm-three-steps-selector formControlName="Seguro_de_vida" [disabled]="selectEnabled" (onchange)="seguroVida($event)">
          </tm-three-steps-selector>
        </div>
      </div>
    </div>


    <ion-item>
      <ion-label stacked>{{mesesPorCovertura}}</ion-label>
      <ion-input type="number" [max-limit]="3" [disabled]="mesesCoberturaEnable" formControlName="Meses_de_Cobertura_por_Muerte"></ion-input>
    </ion-item>
    <samp class="error-spam " *ngIf="!this.todo.get('Meses_de_Cobertura_por_Muerte').valid  && this.todo.get('Meses_de_Cobertura_por_Muerte').value != ''">Longitud máxima 3 caracteres</samp>

    <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 20px; ">
      <div style="display: flex; justify-content: initial; width: 50%;;">
        ¿Reparto de utilidades?
      </div>
      <div style="width: 50%;">
        <div style="width: 100px;">
          <tm-three-steps-selector formControlName="Reparto_de_utilidades" [disabled]="selectEnabled" (onchange)="repartoUtilidades($event)">
          </tm-three-steps-selector>
        </div>
      </div>
    </div>


    <ion-item>
      <ion-label stacked>{{labelUltimomonto}}</ion-label>
      <ion-input type="tel" [disabled]="ultimomontoEnable" [max-limit]="12" formControlName="Ultimo_monto_recibido"
      [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
    </ion-item>
    <samp class="error-spam " *ngIf="!this.todo.get('Ultimo_monto_recibido').valid  && this.todo.get('Ultimo_monto_recibido').value != '' ">Formato incorrecto</samp>


    <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 20px; ">
      <div  style="display: flex; justify-content: initial; width: 50%;;">
        ¿Plan de pensiones?
      </div>
      <div style="width: 50%;">
        <div style="width: 100px;">
          <tm-three-steps-selector formControlName="Plan_de_pensiones" [disabled]="selectEnabled" (onchange)="changeState($event)">
          </tm-three-steps-selector>
        </div>
      </div>
    </div>

    <ion-item>
        <ion-label style="color: #000; font-size: 14px; position: absolute;left: 10px;" stacked>¿Otra prestación?</ion-label>
      <ion-input type="text" style="margin-top: 30px;" [max-limit]="50" formControlName="Otra_prestacion"></ion-input>
    </ion-item>

    <samp class="error-spam " *ngIf="!this.todo.get('Otra_prestacion').valid  && this.todo.get('Otra_prestacion').value != '' ">Longitud máxima 50 caracteres</samp>

    <div style="display: flex; flex-direction: row; justify-content: center; padding-bottom: 25px;">
      <button ion-button type="submit" [disabled]="!todo.valid">guardar</button>
    </div>
  </form>
</ion-content>
