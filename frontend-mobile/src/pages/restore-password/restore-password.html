<ion-header no-margin no-padding>
    <img src="./assets/imgs/cambiarcontrasena.png" style="height: 100%; width: 100%; background-size: cover; background-position:center; background-repeat: no-repeat;">
    <div class="text-title" >Cambio <br> de contraseña</div>
  </ion-header>

<ion-content style="height: 100%;" >
  <form [formGroup]="todo" (ngSubmit)="saveContrasena()">

        <div style="margin-left: 16px; margin-top: 40px;">
            <div class="labels">¿Deseas cambiar tu contraseña?</div>
            
        </div>
        <div style="margin: 16px;">Ingresa una nueva contraseña.</div>
        
          <ion-item>
            <ion-label stacked>Contraseña actual*</ion-label>
            <ion-input type="password" formControlName="contrasenaactual" maxlength="50"></ion-input>
          </ion-item>

          <ion-item>
              <ion-label stacked>Contraseña nueva*</ion-label>
              <ion-input type="password" formControlName="contrasenanueva" maxlength="50"></ion-input>
          </ion-item>

          <ion-item>
                <ion-label stacked>Confirmar contraseña*</ion-label>
                <ion-input type="password" formControlName="confirmarcontrasena" maxlength="50"></ion-input>
          </ion-item>
          
          <div style=" display: flex; justify-content: center;">
            <button  ion-button type="submit" [disabled]="!todo.valid">Guardar</button>

          </div>
      </form>
</ion-content>
