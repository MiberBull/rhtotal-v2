<ion-content style="height: 100%; width: 100%">
  <!--<div class="contentImage" style="background-image: url('assets/imgs/beneficiosdescuentos.png');
      background-repeat: no-repeat; background-size: cover; height: 40% !important;">
  </div> -->
  <div class="content-header" style="background-image: url('assets/imgs/beneficiosdescuentos.png');background-repeat: no-repeat; background-size: cover; height: 40% !important;">
      <div class="content-sub-header" (click)="backDiscountGeneral()" >
        <ion-icon ios="ios-arrow-back" md="md-arrow-back" class="image-header" ></ion-icon>
        <div class="content-somos"></div>
      </div>
  </div>


  <div style="height:60%; overflow-y: auto; padding-bottom: 15%; background-color: #E6E6E5">
    <div style="height:30%; ">
        <ion-card (click)="goBenefitsOption()">
            <ion-card-content style="display: flex; flex-direction:row;">
                    <div class="content-card-generic">
                    <img src="assets/imgs/beneficiosopcion.svg" class="image-icon-card">
                    </div>
                    <div class="content-contet-card">
                      
                    <div>
                      <p class="titulo-card">Beneficios</p>
                      <p style="font-size: 14px;">Beneficios pensados para tu vida</p>
                     </div>
  
                     </div>

                     <div class="image-card">
                      <img src="assets/imgs/arrow.svg" style="width: 40%">
                     </div>
            </ion-card-content>
          </ion-card>
    </div>
    <div style="height:30%;">
        <ion-card (click)="goDiscountOption()">
            <ion-card-content style="display: flex; flex-direction:row;">
                    <div class="content-card-generic">
                    <img src="assets/imgs/descuentos.svg" class="image-icon-card">
                    </div>
                    <div class="content-contet-card">
                      
                      <div>
                      <p class="titulo-card">Descuentos</p>
                      <p style="font-size: 14px;">Obtén promociones exclusivas</p>
                     </div>
  
                     </div>
                     <div class="image-card">
                        <img src="assets/imgs/arrow.svg" style="width: 40%">
                     </div>
            </ion-card-content>
          </ion-card>
    </div> 
    <div style="height:30%;">
        <ion-card (click)="goQuoteSafe()">
            <ion-card-content style="display: flex; flex-direction:row;">
                    <div class="content-card-generic">
                    <img src="assets/imgs/cotizarseguro.svg" class="image-icon-card">
                    </div>
                    <div class="content-contet-card">
                      <div>
                      <p class="titulo-card">Cotizar seguro</p>
                      <p style="font-size: 14px;">Recibe la mejor asesoría en seguros</p>
                     </div>
  
                     </div>
                     <div class="image-card">
                        <img src="assets/imgs/arrow.svg" style="width: 40%">
                     </div>
            </ion-card-content>
          </ion-card>
    </div>  
    <div style="height:30%;">
        <ion-card (click)="insurangeBenefis()">
            <ion-card-content style="display: flex; flex-direction:row;">
                    <div class="content-card-generic">
                    <img [src]="dataimageDinamic" class="image-icon-card">
                    </div>
                    <div class="content-contet-card">
                      
                      <div>
                      <p [ngClass]="( userType == 'IN' ) ? 'title-card' : 'title-card-extern'">Mis seguros</p>
                      <p [ngClass]="( userType == 'IN' ) ? 'subtitle-card' : 'subtitle-card-extern'">Consulta tus pólizas de seguros</p>
                     </div>
  
                     </div>
                     <div class="image-card">
                        <img [src]="arrowIntern" style="width: 40%">
                     </div>
            </ion-card-content>
          </ion-card>
    </div>  
    
  </div>
  </ion-content>
