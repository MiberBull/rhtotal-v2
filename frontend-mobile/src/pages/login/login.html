<ion-header class="wrapper-header">
  <img src="assets/imgs/dch-total-slogan.svg" height="120px" class="image-header" />
  <ion-label class="title">Gestión integral de talento</ion-label>
</ion-header>
<ion-content>
  <form [formGroup]="loginForm" class="wrapper-form">
    <ion-item>
      <ion-input
        [formControl]="loginForm.controls['email']"
        type="email"
        (ionChange)="resetIntents()"
        placeholder="Correo electrónico"
        style="text-transform: lowercase"
      ></ion-input>
    </ion-item>
    <ion-item>
      <ion-input
        [formControl]="loginForm.controls['password']"
        type="password"
        max="12"
        placeholder="Contraseña"
      ></ion-input>
    </ion-item>
    <button
      ion-button
      color="secondary"
      (click)="onLogin()"
      [disabled]="!loginForm.valid"
      class="buttons"
      style="margin-top: 10%"
    >
      Entrar
    </button>
  </form>
  <div class="content-first-visit">
    <ion-label style="color: #fff">¿Primera vez aquí?</ion-label>
    <button ion-button color="light" (click)="goCreateAccount()" class="buttons">
      Crear cuenta
    </button>
  </div>
  <div class="wrapper-forget-password">
    <label class="labels" (click)="goRecoveryPassword()">Olvidé mi contraseña</label>
  </div>
</ion-content>
