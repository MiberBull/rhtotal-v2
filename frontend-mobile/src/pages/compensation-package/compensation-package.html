<ion-header>
    <ion-toolbar no-padding>
        <ion-grid>
          <ion-row col-12>
            <ion-icon ios="ios-arrow-back" md="md-arrow-back" style="color:#1099D6; font-size:30px;" (click)="returnPageCompensation()"></ion-icon>
            <div class="title">Paquete de compensación</div>
          </ion-row>
          <ion-row >
              <ion-col col-12>
                    <p class="encabezado">Llena tus datos y accede<br> a más beneficios</p>   
              </ion-col>
          </ion-row>
        </ion-grid>
    </ion-toolbar>
</ion-header>

<ion-content>
        <ion-tabs #myTabsCompensation tabsPlacement="top">
            <ion-tab [root]="tab1Root"  tabTitle="Prestaciones" ></ion-tab>
            <ion-tab [root]="tab2Root"  tabTitle="Seguros"></ion-tab>
            <ion-tab [root]="tab3Root"  tabTitle="Bonos"></ion-tab>
            <ion-tab [root]="tab4Root"  tabTitle="Sueldo"></ion-tab>
          </ion-tabs>          

</ion-content>
