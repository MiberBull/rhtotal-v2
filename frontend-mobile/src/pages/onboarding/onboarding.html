<ion-content class="no-scroll" >
  <ion-slides effect="slide" pager (ionSlideNextStart)="slideChanged()">
    <ion-slide class="one-background">
      <div class="wrapper-info">
        <label class="title-onboarding">{{ slides[0].title }}</label>
        <p class="subtitle-onboarding">{{ slides[0].paragraph }}</p>
        <img src="assets/imgs/onboarding/banda.svg" alt="">
        <button ion-button color="light" clear (click)="goLogin()" class="next">{{ slides[0].next }}</button>
      </div>
    </ion-slide>
    <ion-slide class="two-background">
      <div class="wrapper-info">
        <label class="title-onboarding">{{ slides[1].title }}</label>

      </div>
    </ion-slide>
    <ion-slide class="six-background">
    </ion-slide>
  </ion-slides>
</ion-content>
