  Ionic pages and navigation.
-->
<ion-content style="height: 100%; width: 100%">
  <!-- BANNER -->
  <div class="content-header" style="background-image: url('assets/imgs/ayuda.png');background-repeat: no-repeat; background-size: cover; height: 40% !important;">
    <div class="content-sub-header" (click)="backhome()">
      <ion-icon ios="ios-arrow-back" md="md-arrow-back" class="image-header">        
      </ion-icon>
      <div class="content-somos"></div>
    </div>
  </div>

  <!-- CONTENT -->
  <ion-content style="height: 60%;">
    <div class="content-interno">
      <div style="text-align: justify;">
        <p class="text-content">
          {{arrayInfo[0]}}
        </p>
      </div>
      
      <ion-item style="padding: 0px;">
        <ion-label style="padding: 0px;" stacked>
          Soporte
        </ion-label>
        <ion-select multiple="false"  interface="action-sheet" [(ngModel)]="supportType" (ionChange)="getSupportSelected();" >
          <ion-option *ngFor="let support of supports; let idx = index" value="{{support.id}}" selected="{{(idx==0).toString()}}">{{support.name}} 
          </ion-option>
        </ion-select>            
      </ion-item>

      <ion-textarea rows="6" cols="30" [(ngModel)]="supportText" (ionChange)="wordCount()">
      </ion-textarea>

      <ion-label stacked>
        <b [style.color]="styleValidator" >
          {{textValidator}}
        </b>
      </ion-label>

      <div class="content-buttom-alert">
        <button ion-button (click)="sendSupport()" [disabled]="isDisable">Enviar</button>       
      </div>

      <div class ="content-help">
        <div style="height: 30%; margin-left: 10px; margin-right: 10px;">
          <div style="padding-top: 15px;">
            <div>
              <span class="font-text-2"  >
                {{arrayInfo[4]}}
              </span>
            </div>
            <div>
              <span>
                <u class="telefono">
                  <a href="tel: {{arrayInfo[5]}} ">
                    {{arrayInfo[5]}}
                  </a>
                </u>
              </span>
            </div>
          </div>
        </div>
      </div> 
    </div>
  </ion-content>






</ion-content>
