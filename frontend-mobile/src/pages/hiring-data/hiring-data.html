<ion-header>
    <ion-toolbar no-padding>
        <ion-grid>
          <ion-row col-12  (click)="back()">
            <ion-icon ios="ios-arrow-back" md="md-arrow-back" style="color:#1099D6; font-size:30px;" ></ion-icon>
            <div class="title">Datos de contratación</div>
          </ion-row>
          <ion-row >
              <ion-col col-12>
                  <p class="encabezado">Llena tus datos y accede <br> a más beneficios</p>
              </ion-col>
          </ion-row>
        </ion-grid>
    </ion-toolbar>
</ion-header>

<ion-content padding-right padding-bottom>
  <form [formGroup]="todo" style="padding-bottom: 25px;" (ngSubmit)="getInfoForm()">

    <ion-item>
      <ion-label stacked>Ingreso neto por asimilados</ion-label>
      <ion-input type="tel" [max-limit]="12" [disabled]="salaryEnable" formControlName="qtSalary"
      [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
    </ion-item>
    <samp class="error-spam" *ngIf="!this.todo.get('qtSalary').valid  && this.todo.get('qtSalary').value != ''">Formato incorrecto</samp>

    <ion-item>
      <ion-label stacked>Área</ion-label>
      <ion-input type="text" [max-limit]="50" formControlName="dsArea"></ion-input>
    </ion-item>
    <samp class="error-spam" *ngIf="!this.todo.get('dsArea').valid">Longitud máxima 50 caracteres</samp>

    <ion-item>
      <ion-label stacked>Puesto</ion-label>
      <ion-input type="text" [max-limit]="50" [disabled]="jobEnable" formControlName="job"></ion-input>
    </ion-item>
    <samp class="error-spam" *ngIf="!this.todo.get('job').valid">Longitud máxima 50 caracteres</samp>

    <!--on-item>
      <ion-label stacked>Fecha fin contrato</ion-label>
      <ion-datetime formControlName="endOfContract" cancelText="CANCELAR"
      doneText="ACEPTAR" max="2050" [disabled]="false" displayFormat="DD/MM/YYYY"></ion-datetime>
      <ion-icon ios="ios-calendar" md="md-calendar" color="iconColor" item-right small></ion-icon>
    </ion-item-->

    <div style="display: flex; flex-direction: row; justify-content: center;">
      <button ion-button type="submit">guardar</button>
    </div>
  </form>
</ion-content>
