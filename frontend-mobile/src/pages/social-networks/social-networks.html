<ion-content  padding>
    
    <div style="display: flex; justify-content: center; align-items: center;" *ngFor="let social of arraySocialNetwork">
        <ion-label fixed>{{social.name}}</ion-label>
        <div style="width: 100px;">
              <tm-three-steps-selector  [(ngModel)]="social.value" [disabled]="selectEnabled" (onchange)="changeState($event)">
              </tm-three-steps-selector>
       </div>
     </div>
     <div style=" padding-bottom: 25px; ">
         <button ion-button type="submit" style="margin-left: auto; display:block; margin-right: auto; margin-top: 10px;"  (click)="saveSocialNetwork()">guardar</button>
     </div>
</ion-content>
