<!--
  Generated template for the BonusesPage page.

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->

<ion-content>
    <form [formGroup]="todo" (ngSubmit)="saveBonues()" padding-right padding-bottom>

        <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 15px; ">
            <div style="display: flex; justify-content: initial; width: 50%;;">
                Bono mensual
            </div>
            <div style="width: 50%;">
                <div style="width: 100px;">
                    <tm-three-steps-selector formControlName="Bono_Mensual" [disabled]="selectEnabled" (onchange)="bonoMensual($event)">
                    </tm-three-steps-selector>
                </div>
            </div>
        </div>

        <ion-item>
            <ion-label stacked>{{labelCantidadBono}}</ion-label>
            <ion-input type="tel" [disabled]="bonoMensualEnable" [max-limit]="12" formControlName="Cantidad_Bono_Mensual"
                       [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"> </ion-input>
        </ion-item>
        <samp class="error-spam " *ngIf="!this.todo.get('Cantidad_Bono_Mensual').valid && this.todo.get('Cantidad_Bono_Mensual').value != ''">Formato incorrecto</samp>

        <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 15px; ">
            <div style="display: flex; justify-content: initial; width: 50%;">
                Bono bimestral
            </div>
            <div style="width: 50%;">
                <div style="width: 100px;">
                    <tm-three-steps-selector formControlName="Bono_Bimestral" [disabled]="selectEnabled" (onchange)="bonoBimestral($event)">
                    </tm-three-steps-selector>
                </div>
            </div>
        </div>

        <ion-item>
            <ion-label stacked>{{labelBonoBimestral}}</ion-label>
            <ion-input type="tel" [disabled]="bonoBimestralEnable" [max-limit]="12" formControlName="Cantidad_Bono_Bimestral"
                       [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
        </ion-item>
        <samp class="error-spam " *ngIf="!this.todo.get('Cantidad_Bono_Bimestral').valid && this.todo.get('Cantidad_Bono_Bimestral').value != ''">Formato incorrecto</samp>


        <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 15px; ">
            <div style="display: flex; justify-content: initial; width: 50%;;">
                Bono trimestral
            </div>
            <div style="width: 50%;">
                <div style="width: 100px;">
                    <tm-three-steps-selector formControlName="Bono_Trimestral" [disabled]="selectEnabled" (onchange)="bonoTrimestral($event)">
                    </tm-three-steps-selector>
                </div>
            </div>
        </div>

        <ion-item>
            <ion-label stacked>{{labelBonoTrimestral}}</ion-label>
            <ion-input type="tel" [disabled]="bonoTrimestralEnable" [max-limit]="12" formControlName="Cantidad_Bono_Trimestral"
            [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
        </ion-item>
        <samp class="error-spam " *ngIf="!this.todo.get('Cantidad_Bono_Trimestral').valid && this.todo.get('Cantidad_Bono_Trimestral').value != ''">Formato incorrecto</samp>


        <div style="display: flex; align-items: inherit; width: 100%; margin-left: 10px; margin-top: 15px; ">
            <div style="display: flex; justify-content: initial; width: 50%;;">
                Bono anual
            </div>
            <div style="width: 50%;">
                <div style="width: 100px;">
                    <tm-three-steps-selector formControlName="Bono_Anual" [disabled]="selectEnabled" (onchange)="BonoAnual($event)">
                    </tm-three-steps-selector>
                </div>
            </div>
        </div>

        <ion-item>
            <ion-label stacked>{{labelBonoAnual}}</ion-label>
            <ion-input type="tel" [disabled]="bonoAnualEnable" [max-limit]="12" formControlName="Cantidad_Bono_Anual"
            [brmasker]="{money: true,thousand: ',', decimalCaracter: '.', decimal: '2'}"></ion-input>
        </ion-item>
        <samp class="error-spam " *ngIf="!this.todo.get('Cantidad_Bono_Anual').valid && this.todo.get('Cantidad_Bono_Anual').value != '' ">Formato incorrecto</samp>

        <ion-item>
            <ion-label stacked>Métricas otorgamiento bono</ion-label>
            <ion-input type="number" [max-limit]="12" formControlName="Metricas_Otorgamiento_Bono"></ion-input>
        </ion-item>
        <samp class="error-spam " *ngIf="!this.todo.get('Metricas_Otorgamiento_Bono').valid">Formato incorrecto</samp>


        <div style="display: flex; flex-direction: row; justify-content: center; padding-bottom: 25px;">
            <button ion-button type="submit" [disabled]="!todo.valid">guardar</button>
        </div>
    </form>

</ion-content>
