<!--

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->

<ion-content style="height: 100%; width: 100%;">
    <div class="content-header" style="background-image: url('assets/imgs/beneficiosoptionheader.png');">
      <div class="content-sub-header" (click)="backDiscount()">
        <ion-icon ios="ios-arrow-back" md="md-arrow-back" class="image-header" ></ion-icon>
        <div class="text-title">Beneficios</div>
      </div>
      <div class="encabezado">Beneficios pensados
        <br> en tu vida</div>
    </div>
  
  
    <div style="height: 80%;">
  
      <div style="height: 25%; margin-left: 30px; margin-right: 30px;">
        <ion-item style="padding-top: 10px; padding-left: 0px;">
          <ion-label style="padding: 0px;">Categoría*</ion-label>
          <ion-select multiple="false"  interface="action-sheet">
            <ion-option *ngFor="let category of categoryOptions"  (ionSelect)="getIdSubcategory(category.id)">{{category.name}} </ion-option>
          </ion-select>
        </ion-item>
  
        <ion-item style="padding-top: 10px; padding-left: 0px;">
          <ion-label style="padding: 0px;">Subcategoría*</ion-label>
          <ion-select multiple="false" [disabled]="subCategoryEnabled" [(ngModel)]="selectedSubcategory" interface="action-sheet">
            <ion-option *ngFor="let subCategory of subCategoryOptions"  value="{{subCategory.id}}"  (ionSelect)="getCardImages(subCategory.id)">{{subCategory.name}}</ion-option>
          </ion-select>
        </ion-item>
      </div>
  
      <ion-content style="height: 60%;">
        <ion-card *ngFor="let image of cards" style="height:60%;" (click)="getDiscountByid(image.id,image.porcentaje)">
            <img [src]="image.imageCandado" *ngIf="!image.enabled" style="height: 45px; width: 45px; position: absolute; z-index: 99;" (click)="accedeNivel(image.levelName[0],image.levelName[1])">
          <ion-card-content style="height: 100%;">
            <div style="position:relative; height:75%;">
              <img [src]="image.base64" style="height:100%;  width: 100%">

            </div>
  
            <div style="height: 15%; width: 100%;  text-align: justify;">
                {{image.descripcion}}
            </div>
          </ion-card-content>
        </ion-card>
        <ion-infinite-scroll style="height: 5%;" (ionInfinite)="doInfinite($event)">
          <ion-infinite-scroll-content threshold="5%"></ion-infinite-scroll-content>
        </ion-infinite-scroll>
  
      </ion-content>
    </div>
  </ion-content>
