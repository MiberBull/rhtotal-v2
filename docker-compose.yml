version: '3'
services:
  web-admin:
    build:
      context: .
      dockerfile: "Dockerfile-web-admin"
    ports:
      - "80:80"
    networks:
      - dchnet
  eurekaservice:
    build:
      context: .
      dockerfile: "Dockerfile-eureka-service"
    ports:
      - "8761:8761"
    networks:
      - dchnet
  gatewayservice:
    build:
      context: .
      dockerfile: "Dockerfile-gateway-service"
    ports:
      - "8000:8000"
    networks:
      - dchnet
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:*}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
  postgres:
    build:
      context: .
      dockerfile: "Dockerfile-postgresql"
    ports:
      - "5432:5432"
    networks:
      - dchnet
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
  securityservice:
    build:
      context: .
      dockerfile: "Dockerfile-security-service"
    ports:
      - "8090:8090"
    networks:
      - dchnet
    environment:
      - TZ=America/Mexico_City
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unbound
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
      - gatewayservice
      - postgres
  applicationservice:
    build:
      context: .
      dockerfile: "Dockerfile-application-service"
    ports:
      - "8091:8091"
    networks:
      - dchnet
    environment:
      - TZ=America/Mexico_City
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unbound
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
      - gatewayservice
      - postgres
  userservice:
    build:
      context: .
      dockerfile: "Dockerfile-user-service"
    ports:
      - "8092:8092"
    networks:
      - dchnet
    environment:
      - TZ=America/Mexico_City
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unbound
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
      - gatewayservice
      - securityservice
      - postgres
  onboardingservice:
    build:
      context: .
      dockerfile: "Dockerfile-onboarding-service"
    ports:
      - "8093:8093"
    networks:
      - dchnet
    environment:
      - TZ=America/Mexico_City
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unbound
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
      - gatewayservice
      - postgres
  attendanceservice:
    build:
      context: .
      dockerfile: "Dockerfile-attendance-service"
    ports:
      - "8094:8094"
    networks:
      - dchnet
    environment:
      - TZ=America/Mexico_City
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unbound
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
      - gatewayservice
      - postgres
  hrservice:
    build:
      context: .
      dockerfile: "Dockerfile-hr-service"
    ports:
      - "8095:8095"
    networks:
      - dchnet
    environment:
      - TZ=America/Mexico_City
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unbound
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
      - gatewayservice
      - postgres
  documentservice:
    build:
      context: .
      dockerfile: "Dockerfile-document-service"
    ports:
      - "8096:8096"
    networks:
      - dchnet
    environment:
      - TZ=America/Mexico_City
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unbound
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - EUREKA_HOST=eurekaservice
    depends_on:
      - eurekaservice
      - gatewayservice
      - postgres
networks:
  dchnet:
