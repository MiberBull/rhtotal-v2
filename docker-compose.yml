version: '3'
services:
  frontend:
    build:
      context: .
      dockerfile: "Dockerfile-frontend"
    ports:
      - "80:80"
    networks:
      - rhtotalnet
  gatewayservice:
    build:
      context: .
      dockerfile: "Dockerfile-gateway-service"
    ports:
      - "8000:8000"
    networks:
      - rhtotalnet
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:*}
  postgres:
    build:
      context: .
      dockerfile: "Dockerfile-postgresql"
    ports:
      - "5432:5432"
    networks:
      - rhtotalnet
    environment:
      - POSTGRES_PASSWORD=${DB_PASS:-project123}
  securityservice:
    build:
      context: .
      dockerfile: "Dockerfile-security-service"
    ports:
      - "8090:8090"
    networks:
      - rhtotalnet
    environment:
      - TZ=America/Mexico_City
      - DB_PASS=${DB_PASS:-project123}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
    depends_on:
      - gatewayservice
      - postgres
  applicationservice:
    build:
      context: .
      dockerfile: "Dockerfile-application-service"
    ports:
      - "8091:8091"
    networks:
      - rhtotalnet
    environment:
      - TZ=America/Mexico_City
      - DB_PASS=${DB_PASS:-project123}
    depends_on:
      - gatewayservice
      - postgres
  userservice:
    build:
      context: .
      dockerfile: "Dockerfile-user-service"
    ports:
      - "8092:8092"
    networks:
      - rhtotalnet
    environment:
      - DB_PASS=${DB_PASS:-project123}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
    depends_on:
      - gatewayservice
      - paysheetsicoservice
      - securityservice
      - postgres
  fintechservice:
    build:
      context: .
      dockerfile: "Dockerfile-fintech-service"
    ports:
      - "8093:8093"
    networks:
      - rhtotalnet      
    environment:
      - TZ=America/Mexico_City
    depends_on:
      - gatewayservice
      - paysheetsicoservice
  paysheetsicoservice:
    build:
      context: .
      dockerfile: "Dockerfile-paysheetsico-service"
    ports:
      - "8094:8094"
    networks:
      - rhtotalnet
    depends_on:
      - gatewayservice
networks:
  rhtotalnet:
