<ion-app>
  <!-- Side Menu -->
  <ion-menu contentId="main-content" side="start" menuId="mainMenu">
    <ion-header>
      <ion-toolbar color="primary">
        <div class="menu-header">
          <div class="user-avatar">{{ getUserInitial() }}</div>
          <div class="user-info">
            <p class="user-email">{{ userEmail }}</p>
            <p class="user-tenant">DCH Total</p>
          </div>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="none" class="menu-list">
        <ng-container *ngFor="let group of menuGroups">
          <ion-list-header *ngIf="group.label" class="group-label">
            {{ group.label }}
          </ion-list-header>
          <ion-item
            *ngFor="let item of group.items"
            button
            (click)="navigateTo(item.url)"
            detail="false"
            class="menu-item"
          >
            <ion-icon [name]="item.icon" slot="start"></ion-icon>
            <ion-label>{{ item.title }}</ion-label>
          </ion-item>
          <div class="group-divider"></div>
        </ng-container>
      </ion-list>
    </ion-content>

    <ion-footer>
      <ion-item button (click)="logout()" detail="false" lines="none" class="logout-item">
        <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
        <ion-label color="danger">Cerrar sesión</ion-label>
      </ion-item>
      <div class="footer-brand">
        <p>Un servicio de DCH</p>
        <p class="footer-sub">Desarrollada por board-ai.mx</p>
      </div>
    </ion-footer>
  </ion-menu>

  <!-- Main Content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
