<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi Credencial</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="credential-card">
    <!-- Card Header with gradient -->
    <div class="card-header">
      <div class="company-name">{{ credential.company }}</div>
      <div class="card-subtitle">Credencial de Empleado</div>
    </div>

    <!-- Card Body -->
    <div class="card-body">
      <!-- Photo area -->
      <div class="photo-section">
        <ion-avatar class="employee-photo">
          <img *ngIf="credential.photoUrl" [src]="credential.photoUrl" alt="Foto del empleado" />
          <ion-icon *ngIf="!credential.photoUrl" name="person" class="photo-placeholder"></ion-icon>
        </ion-avatar>
      </div>

      <!-- Info section -->
      <div class="info-section">
        <div class="info-row name-row">
          <span class="info-value name">{{ fullName || 'Sin nombre' }}</span>
        </div>

        <div class="info-row">
          <ion-icon name="mail-outline"></ion-icon>
          <span class="info-value">{{ credential.email }}</span>
        </div>

        <div class="info-row" *ngIf="credential.rfc">
          <ion-icon name="document-text-outline"></ion-icon>
          <span class="info-label">RFC:</span>
          <span class="info-value">{{ credential.rfc }}</span>
        </div>

        <div class="info-row">
          <ion-icon name="id-card-outline"></ion-icon>
          <span class="info-label">No. Empleado:</span>
          <span class="info-value">{{ credential.employeeId }}</span>
        </div>
      </div>
    </div>

    <!-- QR Section -->
    <div *ngIf="qrUrl" style="text-align: center; padding: 16px 0 8px">
      <p
        style="
          font-size: 11px;
          color: #999;
          margin-bottom: 8px;
          text-transform: uppercase;
          letter-spacing: 1px;
        "
      >
        Código de verificación
      </p>
      <img
        [src]="qrUrl"
        alt="QR Credencial"
        style="width: 160px; height: 160px; border-radius: 8px"
      />
    </div>

    <!-- Card Footer -->
    <div class="card-footer">
      <div class="footer-line"></div>
      <span class="footer-text">{{ credential.company }}</span>
    </div>
  </div>
</ion-content>
